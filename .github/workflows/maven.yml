name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: maven
    - name: Set version from git tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
    - name: Clone and build KookBC
      run: |
        git clone --depth 1 https://github.com/SNWCreations/KookBC.git
        cd KookBC
        chmod +x gradlew
        ./gradlew shadowJar --no-daemon
    - name: Install KookBC to local Maven repo
      run: |
        ls KookBC/build/libs/
        JAR=$(ls KookBC/build/libs/*.jar | head -1)
        mvn install:install-file -Dfile="$JAR" -DgroupId=io.github.snwcreations -DartifactId=KookBC -Dversion=0.33.0 -Dpackaging=jar
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload a Build Artifact - TLeaf-Link-bukkit
      uses: actions/upload-artifact@v4
      with:
        name: "TLeaf-Link-bukkit.jar"
        path: 'tleaflink-bukkit/target/TLeafLink-bukkit-*.jar'

    - name: Upload a Build Artifact - TLeaf-Link-velocity
      uses: actions/upload-artifact@v4
      with:
        name: "TLeaf-Link-velocity.jar"
        path: 'tleaflink-velocity/target/TLeafLink-velocity-*.jar'

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          tleaflink-bukkit/target/TLeafLink-bukkit-*.jar
          tleaflink-velocity/target/TLeafLink-velocity-*.jar